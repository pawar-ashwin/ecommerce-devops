version: "3.9"

services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/auth
    depends_on:
      - mongo
    volumes:
      - ./auth-service:/app # 👈 Mounts your code live
      - /app/node_modules # 👈 Prevents local node_modules overwrite

  mongo:
    image: mongo:5
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  product-service:
    build: ./product-service
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      - DB_NAME=products
      - DB_USER=root
      - DB_PASSWORD=AngelStatue
      - DB_HOST=mysql
      - DB_PORT=3306

  mysql:
    image: mysql:8.0
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: AngelStatue
      MYSQL_DATABASE: products
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mongo-data:
  mysql-data:
